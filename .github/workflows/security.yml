name: Responsivas Security Analysis

on:
  push:
    branches:
      - main
      - "security/**"
    tags:
      - "1.*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsivas-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glpi-static-analysis:
    name: GLPI-aware PHP and Twig analysis — GLPI ${{ matrix.glpi }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - glpi: "11.0"
            glpi_ref: "11.0/bugfixes"
            php: "8.2"
          - glpi: "12.0"
            glpi_ref: "12.0/bugfixes"
            php: "8.3"

    steps:
      # PR source is checked in an unprivileged job: no repository secrets,
      # no persisted checkout credentials, and no plugin-defined script execution.
      - name: Checkout plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GLPI core comes from fixed trusted refs, never a PR-controlled ref.
      - name: Checkout GLPI ${{ matrix.glpi }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: glpi-project/glpi
          ref: ${{ matrix.glpi_ref }}
          path: glpi
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, ldap, mbstring, mysqli, sodium, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install GLPI development analysis tools
        working-directory: glpi
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --ignore-platform-req=php+ \
            --no-scripts

      - name: Generate GLPI TCPDF font assets (required by GLPI 12)
        if: matrix.glpi == '12.0'
        working-directory: glpi
        run: bash tools/build_fonts.sh

      - name: Prepare plugin analysis workspace
        run: |
          mkdir -p glpi/plugins/responsivas
          cp -a setup.php hook.php src templates locales assets glpi/plugins/responsivas/
          cp .github/phpstan-responsivas.neon glpi/phpstan-responsivas.neon

      - name: Generate a real PDF with the GLPI TCPDF version
        run: |
          php "$GITHUB_WORKSPACE/tests/test-pdf-rendering.php" \
            "$GITHUB_WORKSPACE/glpi" \
            "$GITHUB_WORKSPACE/glpi/plugins/responsivas"

      - name: PHP lint with deprecated syntax detection
        working-directory: glpi
        run: |
          vendor/bin/parallel-lint \
            --show-deprecated \
            --colors \
            plugins/responsivas/setup.php \
            plugins/responsivas/hook.php \
            plugins/responsivas/src

      - name: Twig lint using GLPI rules (non-increasing published-template baseline)
        working-directory: glpi
        shell: bash
        run: |
          set +e
          vendor/bin/twigcs \
            --ansi \
            --no-interaction \
            --ruleset='Glpi\Tools\GlpiTwigRuleset' \
            plugins/responsivas/templates \
            > "$RUNNER_TEMP/twigcs-responsivas.log" 2>&1
          twigcs_status=$?
          set -e
          cat "$RUNNER_TEMP/twigcs-responsivas.log"

          violations="$(grep -oE '[0-9]+ violation.* found' "$RUNNER_TEMP/twigcs-responsivas.log" | grep -oE '^[0-9]+' | tail -n 1)"
          if [[ -z "$violations" ]]; then
            if [[ "$twigcs_status" -eq 0 ]]; then
              violations=0
            else
              echo "TwigCS failed without a parseable violation summary." >&2
              exit "$twigcs_status"
            fi
          fi

          # GLPI TwigCS initially reported 127 pre-existing formatting findings
          # in Responsivas 1.6.6 templates. Keep them visible and forbid growth.
          baseline=127
          if (( violations > baseline )); then
            echo "TwigCS findings increased: $violations (baseline: $baseline)." >&2
            exit 1
          fi
          echo "TwigCS baseline: $violations/$baseline pre-existing template findings; no increase detected."
      - name: PHPStan with GLPI extensions
        # Initial baseline is diagnostic-only; do not report a clean analysis until findings are reviewed.
        continue-on-error: true
        working-directory: glpi
        run: |
          vendor/bin/phpstan analyse \
            --configuration=phpstan-responsivas.neon \
            --no-progress \
            --error-format=table \
            --memory-limit=1G

      - name: Psalm security and taint analysis
        # Initial baseline is diagnostic-only; do not report a clean analysis until findings are reviewed.
        continue-on-error: true
        working-directory: glpi
        run: |
          vendor/bin/psalm \
            --config="$GITHUB_WORKSPACE/.github/psalm-responsivas.xml" \
            --long-progress \
            --output-format=github

  # CodeQL default setup is already enabled at repository level. Avoid a
  # duplicate advanced SARIF upload; GitHub rejects simultaneous default and
  # advanced CodeQL configurations for the same repository.
  gitleaks:
    name: Detect exposed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  workflow-audit:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true
          persona: regular
          min-severity: medium
          min-confidence: medium
